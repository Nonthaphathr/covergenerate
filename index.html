<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cover Designer - ระบบสร้างภาพปก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            -webkit-text-size-adjust: 100%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls {
            flex: 1;
            min-width: 340px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
        }

        h1 {
            font-size: 1.5rem;
            color: #fff;
            margin: 0 0 5px 0;
            text-align: center;
            text-shadow: var(--text-shadow);
        }

        .desc {
            text-align: center;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 18px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Textarea for multiline title */
        textarea#titleText {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            box-sizing: border-box;
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        input[type="text"], input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            box-sizing: border-box;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            height: 25px;
        }

        input[type="number"] {
            width: 70px;
            padding: 5px;
            border-radius: 8px;
            border: none;
            text-align: center;
            font-family: 'Sarabun', sans-serif;
            font-weight: bold;
            font-size: 16px;
        }

        /* Line height control for title */
        .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .btn-download {
            background: linear-gradient(90deg, #1CB5E0 0%, #000851 100%);
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-download:active { transform: scale(0.98); }

        .preview {
            flex: 2;
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background-color: #fff;
        }

        .footer {
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }

        @media (min-width: 769px) { .preview { min-width: 400px; } }
        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 10px; }
            .preview { order: -1; margin-bottom: 10px; }
            .controls { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h1>🎨 Smart Cover Designer</h1>
            <p class="desc">
                ระบบสร้างภาพปกผลงานครูนนทพัทธ์ หิรัญเรือง<br>
                สร้างปกสวยงามระดับมืออาชีพได้ง่ายๆ และรวดเร็ว
            </p>
            
            <div class="input-group">
                <label>หัวข้อหลัก (Main Title)</label>
                <textarea id="titleText" placeholder="ใส่ชื่อเรื่อง&#10;กด Enter เพื่อขึ้นบรรทัดใหม่">ระบบ...</textarea>
                <p class="hint">💡 กด Enter เพื่อขึ้นบรรทัดใหม่</p>

                <label style="margin-top:10px; font-size:0.8rem; color:#aaa;">ขนาดตัวอักษร (px)</label>
                <div class="control-row">
                    <input type="range" id="titleSize" min="40" max="200" value="80">
                    <input type="number" id="titleSizeNum" value="80" min="40" max="200">
                </div>

                <label style="margin-top:10px; font-size:0.8rem; color:#aaa;">ระยะห่างระหว่างบรรทัด (Line Height)</label>
                <div class="control-row">
                    <input type="range" id="titleLineHeight" min="0.8" max="2.5" step="0.05" value="1.3">
                    <input type="number" id="titleLineHeightNum" value="1.3" min="0.8" max="2.5" step="0.05">
                </div>

                <label style="margin-top:10px; font-size:0.8rem; color:#aaa;">ตำแหน่ง (Y-Axis)</label>
                <input type="range" id="titleY" min="100" max="800" value="380" style="width:100%">
            </div>

            <div class="input-group">
                <label>หัวข้อรอง (Subtitle)</label>
                <input type="text" id="subtitleText" placeholder="รายละเอียด (ถ้ามี)" value="">
                
                <label style="margin-top:10px; font-size:0.8rem; color:#aaa;">ขนาดตัวอักษร (px)</label>
                <div class="control-row">
                    <input type="range" id="subSize" min="20" max="150" value="40">
                    <input type="number" id="subSizeNum" value="40" min="20" max="150">
                </div>

                <label style="margin-top:10px; font-size:0.8rem; color:#aaa;">ตำแหน่ง (Y-Axis)</label>
                <input type="range" id="subY" min="100" max="850" value="480" style="width:100%">
            </div>

            <div class="input-group">
                <label>ชื่อเจ้าของผลงาน</label>
                <input type="text" id="nameText" value="ครูนนทพัทธ์ หิรัญเรือง">
                <input type="range" id="nameY" min="500" max="880" value="750" style="width:100%">
            </div>

            <div class="input-group">
                <label>สีตัวอักษร</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <button class="btn-download" onclick="saveImage()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                บันทึกภาพ / แชร์ (iOS)
            </button>
        </div>

        <div class="preview">
            <canvas id="coverCanvas" width="1200" height="900"></canvas>
        </div>
        
        <div class="footer">
            © 2026 ระบบสร้างปกอัตโนมัติ | Nonthaphat Hiranrueang
        </div>
    </div>

    <script>
        const canvas = document.getElementById('coverCanvas');
        const ctx = canvas.getContext('2d');
        
        const bgImage = new Image();
        bgImage.crossOrigin = "Anonymous"; 
        bgImage.src = 'https://nonthaphathr.github.io/uploadimg/blankbg.png';

        const el = {
            title: document.getElementById('titleText'),
            titleSize: document.getElementById('titleSize'),
            titleSizeNum: document.getElementById('titleSizeNum'),
            titleY: document.getElementById('titleY'),
            titleLineHeight: document.getElementById('titleLineHeight'),
            titleLineHeightNum: document.getElementById('titleLineHeightNum'),

            sub: document.getElementById('subtitleText'),
            subSize: document.getElementById('subSize'),
            subSizeNum: document.getElementById('subSizeNum'),
            subY: document.getElementById('subY'),
            
            name: document.getElementById('nameText'),
            nameY: document.getElementById('nameY'),
            color: document.getElementById('textColor')
        };

        bgImage.onload = () => {
            draw();
            canvas.style.animation = "fadeIn 1.5s ease";
        };
        
        document.fonts.ready.then(() => draw());

        function syncInputs(slider, number) {
            slider.addEventListener('input', () => { number.value = slider.value; draw(); });
            number.addEventListener('input', () => { slider.value = number.value; draw(); });
        }

        syncInputs(el.titleSize, el.titleSizeNum);
        syncInputs(el.subSize, el.subSizeNum);
        syncInputs(el.titleLineHeight, el.titleLineHeightNum);

        [el.title, el.titleY, el.sub, el.subY, el.name, el.nameY, el.color].forEach(input => {
            input.addEventListener('input', draw);
        });

        /**
         * วาดข้อความหลายบรรทัด โดย split ด้วย \n
         * @param {string} text - ข้อความ (อาจมี \n)
         * @param {number} x - ตำแหน่ง x
         * @param {number} startY - ตำแหน่ง y ของบรรทัดแรก
         * @param {number} fontSize - ขนาดตัวอักษร (px)
         * @param {number} lineHeightMultiplier - ตัวคูณระยะบรรทัด
         */
        function drawMultilineText(text, x, startY, fontSize, lineHeightMultiplier) {
            const lines = text.split('\n');
            const lineHeight = fontSize * lineHeightMultiplier;
            lines.forEach((line, i) => {
                ctx.fillText(line, x, startY + i * lineHeight);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = el.color.value;

            const titleSize = parseInt(el.titleSize.value);
            const lineHeightMul = parseFloat(el.titleLineHeight.value);

            // Draw Title (multiline)
            ctx.font = `bold ${titleSize}px 'Prompt'`;
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            drawMultilineText(
                el.title.value,
                canvas.width / 2,
                parseInt(el.titleY.value),
                titleSize,
                lineHeightMul
            );

            // Draw Subtitle
            ctx.font = `500 ${el.subSize.value}px 'Sarabun'`;
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(el.sub.value, canvas.width / 2, parseInt(el.subY.value));

            // Draw Name
            ctx.font = `600 36px 'Sarabun'`; 
            ctx.fillText(el.name.value, canvas.width / 2, parseInt(el.nameY.value));
        }

        async function saveImage() {
            const fileName = 'Cover_' + new Date().getTime() + '.png';

            if (navigator.canShare && navigator.share) {
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], fileName, { type: "image/png" });
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'ปกผลงาน',
                            text: 'สร้างปกสำเร็จแล้วโดยครูนนทพัทธ์',
                        });
                    } catch (error) {
                        console.log('Sharing failed or cancelled', error);
                        if (error.name !== 'AbortError') simpleDownload(fileName);
                    }
                }, 'image/png');
            } else {
                simpleDownload(fileName);
            }
        }

        function simpleDownload(filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
