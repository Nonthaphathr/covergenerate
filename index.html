<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสร้างภาพปกผลงานครูนนทพัทธ์ หิรัญเรือง</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.15); /* ปรับให้ใสขึ้นเพื่อให้เห็น BG ชัดขึ้น */
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            /* พื้นหลังสีเข้มขึ้นเล็กน้อยเพื่อให้ตัวหนังสือสีขาวเด่น */
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            /* ป้องกันการเด้งของหน้าจอใน iOS */
            -webkit-text-size-adjust: 100%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            /* รองรับ Safe Area ของ iPhone */
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Control Panel */
        .controls {
            flex: 1;
            min-width: 320px;
            background: rgba(0, 0, 0, 0.4); /* พื้นหลังดำจางๆ เพื่อให้อ่านเมนูง่ายบนมือถือ */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* iOS Safari Support */
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
        }

        h1 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: var(--text-shadow);
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        /* Input Optimization for iOS */
        input[type="text"], input[type="color"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px; /* ป้องกัน iOS ซูม */
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: all 0.3s ease;
            box-sizing: border-box;
            -webkit-appearance: none; /* ลบสไตล์เดิมของ iOS */
        }

        input[type="color"] {
            height: 45px;
            padding: 2px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            height: 25px; /* เพิ่มพื้นที่สัมผัสให้นิ้วเลื่อนง่ายขึ้น */
            cursor: pointer;
        }

        .btn-download {
            background: linear-gradient(90deg, #FF512F 0%, #DD2476 100%);
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(221, 36, 118, 0.4);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* Preview Panel */
        .preview {
            flex: 2;
            min-width: 100%; /* บนมือถือให้เต็มจอ */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #fff;
        }

        .footer {
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }

        /* Mobile Specific Layout */
        @media (min-width: 769px) {
            .preview { min-width: 400px; } /* Desktop */
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 10px;
            }
            .preview {
                order: -1; /* เอารูปขึ้นก่อนเมนูในมือถือ */
                margin-bottom: 10px;
            }
            .controls {
                min-width: auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h1>🎨 สร้างปกผลงาน<br>ครูนนทพัทธ์ หิรัญเรือง</h1>
            
            <div class="input-group">
                <label>หัวข้อหลัก (Main Title)</label>
                <input type="text" id="titleText" placeholder="ใส่ชื่อเรื่อง" value="ระบบ...">
                <input type="range" id="titleSize" min="40" max="150" value="80">
                <input type="range" id="titleY" min="100" max="800" value="380">
            </div>

            <div class="input-group">
                <label>หัวข้อรอง (Subtitle)</label>
                <input type="text" id="subtitleText" placeholder="รายละเอียด (ถ้ามี)" value="">
                <input type="range" id="subSize" min="20" max="100" value="40">
                <input type="range" id="subY" min="100" max="850" value="480">
            </div>

            <div class="input-group">
                <label>ชื่อเจ้าของผลงาน</label>
                <input type="text" id="nameText" value="ครูนนทพัทธ์ หิรัญเรือง">
                <input type="range" id="nameY" min="500" max="880" value="750">
            </div>

            <div class="input-group">
                <label>สีตัวอักษร (เลือกสี)</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <button class="btn-download" onclick="downloadImage()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                บันทึกภาพปก
            </button>
            <div style="text-align:center; margin-top:10px; font-size:0.8rem; color:rgba(255,255,255,0.7);">
                *บน iPhone หากกดปุ่มแล้วภาพเด้งขึ้นมา<br>ให้แตะค้างที่ภาพแล้วเลือก "Save to Photos"
            </div>
        </div>

        <div class="preview">
            <canvas id="coverCanvas" width="1200" height="900"></canvas>
        </div>
        
        <div class="footer">
            © 2026 ระบบสร้างปกอัตโนมัติ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('coverCanvas');
        const ctx = canvas.getContext('2d');
        
        const bgImage = new Image();
        bgImage.crossOrigin = "Anonymous"; 
        bgImage.src = 'https://nonthaphathr.github.io/uploadimg/blankbg.png';

        const inputs = {
            title: document.getElementById('titleText'),
            titleSize: document.getElementById('titleSize'),
            titleY: document.getElementById('titleY'),
            sub: document.getElementById('subtitleText'),
            subSize: document.getElementById('subSize'),
            subY: document.getElementById('subY'),
            name: document.getElementById('nameText'),
            nameY: document.getElementById('nameY'),
            color: document.getElementById('textColor')
        };

        bgImage.onload = () => {
            draw();
            canvas.style.animation = "fadeIn 1.5s ease";
        };

        // Redraw when fonts are fully loaded to prevent fallback font glitch
        document.fonts.ready.then(function () {
            draw();
        });

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', draw);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Background
            if (bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = inputs.color.value;

            // Draw Title
            ctx.font = `bold ${inputs.titleSize.value}px 'Prompt'`;
            // Add slight shadow for better readability on any background
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(inputs.title.value, canvas.width / 2, parseInt(inputs.titleY.value));

            // Draw Subtitle
            ctx.shadowBlur = 2;
            ctx.font = `500 ${inputs.subSize.value}px 'Sarabun'`;
            ctx.fillText(inputs.sub.value, canvas.width / 2, parseInt(inputs.subY.value));

            // Draw Name
            ctx.font = `600 36px 'Sarabun'`; 
            ctx.fillText(inputs.name.value, canvas.width / 2, parseInt(inputs.nameY.value));
        }

        function downloadImage() {
            // Logic for easy download
            const link = document.createElement('a');
            const filename = 'Cover_' + new Date().getTime() + '.png';
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            
            // Check if mobile device
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                // On some mobile browsers, direct download is blocked. 
                // Opening in new tab is safer for user to manual save.
                const win = window.open();
                if(win){
                    win.document.write('<img src="' + link.href + '" style="width:100%"/>');
                    win.document.title = "กดค้างที่รูปเพื่อบันทึก";
                } else {
                    link.click();
                }
            } else {
                link.click();
            }
        }
    </script>
</body>
</html>
